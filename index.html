<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Understand Your Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0f13;
    --line:#252932;
    --text:#eceef1;
    --text-dim:#9198a3;
    --text-faint:#5b6270;
    --amber:#c94141;
    --gold:#c9a24a;
    --green:#4ac47c;
    --yellow:#e0c04a;
    --orange:#e8964c;
    --red:#e3554f;
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background-color:var(--bg);
    background-image:radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1.6px);
    background-repeat:repeat;
    background-size:26px 26px;
    color:var(--text);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    position:relative;
    overflow-x:hidden;
  }
  body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
  body::before{width:480px;height:480px;background:rgba(201,65,65,0.16);top:-160px;left:-120px;animation:driftA 16s ease-in-out infinite}
  body::after{width:420px;height:420px;background:rgba(90,26,34,0.24);bottom:-160px;right:-100px;animation:driftB 19s ease-in-out infinite}
  @keyframes driftA{0%,100%{transform:translate(0,0) scale(1);opacity:.75}50%{transform:translate(40px,25px) scale(1.15);opacity:1}}
  @keyframes driftB{0%,100%{transform:translate(0,0) scale(1);opacity:.65}50%{transform:translate(-30px,-20px) scale(1.1);opacity:.9}}
  @media (prefers-reduced-motion: reduce){body::before,body::after{animation:none}}
  ::selection{background:rgba(201,65,65,.25)}

  .frame{max-width:600px;margin:0 auto;padding:48px 20px 70px;animation:pageIn .5s cubic-bezier(.16,1,.3,1) both;position:relative;z-index:1}
  @keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  h1{font-size:clamp(22px,4vw,26px);font-weight:700;letter-spacing:-0.02em;margin:0 0 4px}
  .subhead{font-size:13.5px;color:var(--text-dim);margin:0 0 28px}
  .eyebrow{font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--text-faint);margin:0 0 8px}


  .inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
  .field label{display:block;font-size:12px;color:var(--text-faint);margin-bottom:6px}
  input{
    width:100%;background:transparent;border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;font-family:var(--mono);font-size:19px;font-weight:600;
    font-variant-numeric:tabular-nums;color:var(--text);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder{color:var(--text-faint);font-weight:500}
  input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(201,65,65,.15)}

  .snapshot{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
  .card{border:1px solid var(--line);border-radius:10px;padding:14px;transition:transform .15s ease, border-color .15s ease}
  .card:hover{transform:translateY(-2px);border-color:#333a47}
  .card .label{font-size:11.5px;color:var(--text-faint);margin-bottom:5px}
  .card .value{font-family:var(--mono);font-size:23px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
  .card .value.gold{color:var(--gold)}
  .card .value.orange{color:var(--orange)}
  .card .value.red{color:var(--red)}

  .gauge-wrap{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:24px}
  .gauge-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;font-size:12px;color:var(--text-faint)}
  .gauge-reading{font-family:var(--mono);font-weight:700;color:var(--text);font-size:12.5px;font-variant-numeric:tabular-nums}
  .gauge-track{position:relative;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
  .gauge-fill{position:absolute;top:0;left:0;bottom:0;width:0%;border-radius:4px;background:var(--green);transition:width .4s cubic-bezier(.16,1,.3,1), background-color .4s ease}
  .clear-note{font-size:12px;color:var(--text-faint);margin-top:8px}
  .clear-note strong{color:var(--gold);font-family:var(--mono)}

  .analysis{border:1px solid var(--line);border-radius:10px;padding:20px}
  .analysis-empty{color:var(--text-faint);font-size:13.5px;text-align:center;padding:14px 0}
  @keyframes cardUpdate{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:translateY(0)}}
  .analysis-content{animation:cardUpdate .35s cubic-bezier(.16,1,.3,1) both}
  .status-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
  .priority-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:currentColor}
  .status-text{font-size:16px;font-weight:700;letter-spacing:-.005em}
  .priority-word{font-size:11.5px;font-weight:600;margin-left:auto}
  .low{color:var(--green)} .medium{color:var(--yellow)} .high{color:var(--orange)} .critical{color:var(--red)}
  .action-line{font-size:15px;line-height:1.5;color:var(--text);margin-bottom:12px}
  ul.steps{margin:0;padding-left:16px}
  ul.steps li{font-size:13px;line-height:1.6;color:var(--text-dim)}

  @media (max-width:520px){.inputs,.snapshot{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="frame">

    <h1>Understand Your Panel</h1>
    <p class="subhead">The WallStreet Calculator. Enter your numbers.</p>

    <div class="eyebrow">Numbers</div>
    <div class="inputs">
      <div class="field">
        <label for="arrivals">Whitelist</label>
        <input id="arrivals" type="number" placeholder="0" min="0">
      </div>
      <div class="field">
        <label for="recruited">Recruited</label>
        <input id="recruited" type="number" placeholder="0" min="0">
      </div>
      <div class="field">
        <label for="incity">On panel</label>
        <input id="incity" type="number" placeholder="0" min="0">
      </div>
    </div>

    <div class="eyebrow">Snapshot</div>
    <div class="snapshot">
      <div class="card"><div class="label">Recruit rate</div><div class="value gold" id="rateVal">0%</div></div>
      <div class="card"><div class="label">Loss rate</div><div class="value orange" id="lossVal">0%</div></div>
      <div class="card"><div class="label">Lost</div><div class="value red" id="lostVal">0</div></div>
    </div>

    <div class="gauge-wrap">
      <div class="gauge-top"><span>Loss level</span><span class="gauge-reading" id="gaugeReading">0.0%</span></div>
      <div class="gauge-track"><div class="gauge-fill" id="gaugeFill"></div></div>
      <div class="clear-note" id="clearNote" style="display:none"></div>
    </div>

    <div class="eyebrow">What to do</div>
    <div class="analysis" id="analysisBox">
      <div class="analysis-empty">Enter your numbers above.</div>
    </div>

  </div>

<script>
  function tween(el, from, to, decimals) {
    const duration = 260;
    const start = performance.now();
    function frame(now) {
      const t = Math.min((now - start) / duration, 1);
      const eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      const val = from + (to - from) * eased;
      el.textContent = decimals === null ? Math.round(val) : val.toFixed(decimals) + "%";
      if (t < 1) requestAnimationFrame(frame);
      else el.textContent = decimals === null ? to : to.toFixed(decimals) + "%";
    }
    requestAnimationFrame(frame);
  }

  const prev = { rate: 0, loss: 0, lost: 0 };
  let lastStatus = null;

  function updateGauge(rate) {
    const capped = Math.max(0, Math.min(rate, 50));
    const pct = (capped / 50) * 100;
    const fill = document.getElementById("gaugeFill");
    fill.style.width = pct + "%";
    let color = "var(--green)";
    if (rate >= 35) color = "var(--red)";
    else if (rate >= 25) color = "var(--orange)";
    else if (rate >= 18) color = "var(--yellow)";
    fill.style.background = color;
    document.getElementById("gaugeReading").textContent = rate.toFixed(1) + "%";
  }

  function backlogLevel(inCity) {
    if (inCity >= 7) return "stacked";
    if (inCity >= 4) return "building";
    if (inCity >= 1) return "light";
    return "none";
  }
  function lossLevel(rate) {
    if (rate >= 25) return "severe";
    if (rate >= 18) return "rising";
    return "fine";
  }
  const priorityTable = {
    none:     { fine: "low",    rising: "medium", severe: "critical" },
    light:    { fine: "low",    rising: "medium", severe: "high" },
    building: { fine: "medium", rising: "medium", severe: "high" },
    stacked:  { fine: "high",   rising: "high",   severe: "critical" }
  };

  function renderAnalysis(html, status) {
    const box = document.getElementById("analysisBox");
    box.innerHTML = `<div class="analysis-content">${html}</div>`;
    if (status !== lastStatus) {
      const content = box.querySelector(".analysis-content");
      content.style.animation = "none";
      void content.offsetWidth;
      content.style.animation = "";
    }
    lastStatus = status;
  }

  function analyse() {
    const arrivals = Number(document.getElementById("arrivals").value) || 0;
    const recruited = Number(document.getElementById("recruited").value) || 0;
    const inCity = Number(document.getElementById("incity").value) || 0;

    const lost = Math.max(arrivals - recruited - inCity, 0);
    const recruitmentRate = arrivals > 0 ? (recruited / arrivals) * 100 : 0;
    const beginnerLossRate = arrivals > 0 ? (lost / arrivals) * 100 : 0;
    const clearedRate = arrivals > 0 ? ((recruited + inCity) / arrivals) * 100 : 0;

    tween(document.getElementById("rateVal"), prev.rate, recruitmentRate, 1);
    tween(document.getElementById("lossVal"), prev.loss, beginnerLossRate, 1);
    tween(document.getElementById("lostVal"), prev.lost, lost, null);
    prev.rate = recruitmentRate; prev.loss = beginnerLossRate; prev.lost = lost;
    updateGauge(beginnerLossRate);

    const clearNote = document.getElementById("clearNote");
    if (inCity > 0) {
      clearNote.style.display = "block";
      clearNote.innerHTML = `Clear panel now → <strong>${clearedRate.toFixed(1)}%</strong> recruited.`;
    } else {
      clearNote.style.display = "none";
    }

    if (arrivals === 0 && recruited === 0 && inCity === 0) {
      renderAnalysis(`
        <div class="status-row low"><span class="priority-dot"></span><span class="status-text">No arrivals yet</span><span class="priority-word">Low</span></div>
        <div class="action-line">Stay on pier, ready for arrivals.</div>
      `, "idle");
      return;
    }

    const backlog = backlogLevel(inCity);
    const loss = lossLevel(beginnerLossRate);
    const priorityClass = priorityTable[backlog][loss];
    const priorityLabel = priorityClass.charAt(0).toUpperCase() + priorityClass.slice(1);

    let status, action, steps = [];

    if (backlog === "stacked") {
      status = loss === "severe" ? "Panel stacked, already losing beginners"
             : loss === "rising" ? "Panel stacked, losses climbing"
             : "Panel stacked";
      action = loss === "fine" ? "Clear panel before it costs recruits." : "Clear panel now, oldest first. Keep pier covered.";
      steps = ["Oldest on panel first", "Don't leave pier empty"];
    } else if (backlog === "building") {
      status = loss === "severe" ? "Panel building, already losing beginners" : "Panel building";
      action = loss === "severe" ? "Split time pier and panel. Clear it before it grows." : "Split time pier and panel before it stacks up.";
      steps = ["Oldest first", "Keep pier covered"];
    } else if (backlog === "light") {
      status = loss === "severe" ? "Losing beginners, panel is light"
             : loss === "rising" ? "Small panel, losses ticking up"
             : "Panel under control";
      action = loss === "severe" ? "Clear the few on panel. Pier speed is the real issue." : "Clear panel when free, pier stays priority.";
      steps = loss === "severe" ? ["Recruit arrivals fast", "Panel isn't the problem"] : [];
    } else {
      status = loss === "severe" ? "Losing beginners at pier"
             : loss === "rising" ? "A few slipping through"
             : "Running smoothly";
      action = loss === "fine" ? "Keep doing what you're doing." : "Focus pier. Recruit arrivals immediately, don't let them wait.";
      steps = loss === "severe" ? ["Cover pier fully", "Don't leave arrivals unattended"] : [];
    }

    const stepsHtml = steps.length ? `<ul class="steps">${steps.map(s => `<li>${s}</li>`).join("")}</ul>` : "";

    renderAnalysis(`
      <div class="status-row ${priorityClass}"><span class="priority-dot"></span><span class="status-text">${status}</span><span class="priority-word">${priorityLabel}</span></div>
      <div class="action-line">${action}</div>
      ${stepsHtml}
    `, status);
  }

  document.getElementById("arrivals").addEventListener("input", analyse);
  document.getElementById("recruited").addEventListener("input", analyse);
  document.getElementById("incity").addEventListener("input", analyse);
</script>
</body>
</html>
